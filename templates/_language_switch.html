<form class="language-switch" action="{{ url_for('language_choice') }}" method="post" aria-label="Language selection">
  <input type="hidden" name="path" value="{{ language_path }}">
  <span>LANGUAGE</span>
  <button type="submit" name="locale" value="en"{% if page_locale == 'en' %} class="active" aria-current="true"{% endif %}>EN</button>
  <i aria-hidden="true">/</i>
  <button type="submit" name="locale" value="ko"{% if page_locale == 'ko' %} class="active" aria-current="true"{% endif %}>KO</button>
</form>
