<section class="file-result" id="downloadResult" aria-label="Your processed file" hidden>
  <strong class="file-result-name" data-result-name></strong>
  <p data-result-hint></p>
  <div class="file-result-actions">
    <button type="button" data-result-share hidden>SAVE / SHARE FILE</button>
    <a data-result-download>DOWNLOAD FILE</a>
    <a data-result-open target="_blank" rel="noopener" hidden>OPEN PDF</a>
  </div>
  <p class="file-result-status" data-result-status role="status" aria-live="polite"></p>
</section>
